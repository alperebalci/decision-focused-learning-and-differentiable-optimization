name: Contextual Optimization Frontier

on:
  pull_request:
    paths:
      - "projects/integrated-conditional-estimation-optimization/**"
      - "projects/decision-driven-regularization/**"
      - "projects/stochastic-optimization-forests/**"
      - ".github/workflows/contextual-frontier.yml"
  push:
    branches: [main]
    paths:
      - "projects/integrated-conditional-estimation-optimization/**"
      - "projects/decision-driven-regularization/**"
      - "projects/stochastic-optimization-forests/**"
      - ".github/workflows/contextual-frontier.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        project:
          - integrated-conditional-estimation-optimization
          - decision-driven-regularization
          - stochastic-optimization-forests
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
